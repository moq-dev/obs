name: Pull Request
on:
  pull_request:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just check

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just setup
      - run: nix develop --command just build

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just setup
      - run: nix develop --command just build

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: choco install ffmpeg-full -y
      - name: Setup
        run: just setup
      - name: Build
        run: just build
